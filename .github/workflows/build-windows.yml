name: Build MTRX-1K for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Check out source and JUCE submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja --yes --no-progress

      - name: Build VST3 and standalone app
        shell: cmd
        run: build_win.bat

      - name: Package build
        shell: pwsh
        run: |
          $out = "build\win-release\Retromulator_artefacts\Release"
          $vst3 = Join-Path $out "VST3\MTRX-1K.vst3"
          $app = Join-Path $out "Standalone\MTRX-1K.exe"

          if (!(Test-Path $vst3)) {
            throw "VST3 bundle not found: $vst3"
          }

          $stage = "MTRX-1K-Windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path $vst3 -Destination $stage -Recurse -Force

          if (Test-Path $app) {
            New-Item -ItemType Directory -Force -Path "$stage\Standalone" | Out-Null
            Copy-Item -Path $app -Destination "$stage\Standalone" -Force
          } else {
            Write-Warning "Standalone executable was not found; packaging the VST3 plugin only."
          }

          @"
          MTRX-1K Windows x64 build

          VST3 plugin: MTRX-1K.vst3
          Copy the .vst3 folder to:
          C:\Program Files\Common Files\VST3

          Standalone application (if included): Standalone\MTRX-1K.exe

          The Matrix-1000 firmware ROM is NOT included. Supply your own legally
          obtained firmware files as described in the project's README.
          "@ | Set-Content "$stage\README.txt"

          Compress-Archive -Path "$stage\*" -DestinationPath "MTRX-1K-Windows-x64.zip" -Force

      - name: Upload compiled package
        uses: actions/upload-artifact@v4
        with:
          name: MTRX-1K-Windows-x64
          path: MTRX-1K-Windows-x64.zip
          if-no-files-found: error
